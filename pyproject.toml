[project]
name = "mojoco-lqr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.7.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["control", "tests"]
exclude = ["control/dm-tools", "control/motor-control-routine"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
