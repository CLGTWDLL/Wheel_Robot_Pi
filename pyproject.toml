[project]
name = "mojoco-lqr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.7.0",
    "optuna>=4.8.0",
    "pyserial>=3.5",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "control"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["control", "tests"]
exclude = ["control/sample"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
